name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with GluonFX
      run: mvn gluonfx:build gluonfx:package -Dgluonfx.mainClass=casopractico01gloriafer.App -Dgluonfx.target=android
      env:
        GRAALVM_HOME: ${{ env.JAVA_HOME }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: target/gluonfx/arm64-android/gboot/*.apk
